name: hermesguard

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${HERMESGUARD_MYSQL_DATABASE:-hermesguard}
      MYSQL_USER: ${HERMESGUARD_MYSQL_USER:-hermesguard}
      MYSQL_PASSWORD: ${HERMESGUARD_MYSQL_PASSWORD:-hermesguard}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hermesguard-root}
      TZ: Asia/Shanghai
    ports:
      - "${HERMESGUARD_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HERMESGUARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      HERMESGUARD_ENVIRONMENT: production
      HERMESGUARD_MYSQL_HOST: mysql
      HERMESGUARD_MYSQL_PORT: 3306
      HERMESGUARD_MYSQL_DATABASE: ${HERMESGUARD_MYSQL_DATABASE:-hermesguard}
      HERMESGUARD_MYSQL_USER: ${HERMESGUARD_MYSQL_USER:-hermesguard}
      HERMESGUARD_MYSQL_PASSWORD: ${HERMESGUARD_MYSQL_PASSWORD:-hermesguard}
      HERMESGUARD_REDIS_HOST: redis
      HERMESGUARD_REDIS_PORT: 6379
    ports:
      - "${HERMESGUARD_API_PORT:-8001}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    command:
      [
        "celery",
        "-A",
        "hermesguard_server.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
      ]
    environment:
      HERMESGUARD_ENVIRONMENT: production
      HERMESGUARD_MYSQL_HOST: mysql
      HERMESGUARD_REDIS_HOST: redis
      HERMESGUARD_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    command:
      [
        "celery",
        "-A",
        "hermesguard_server.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    environment:
      HERMESGUARD_ENVIRONMENT: production
      HERMESGUARD_MYSQL_HOST: mysql
      HERMESGUARD_REDIS_HOST: redis
      HERMESGUARD_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "${HERMESGUARD_WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
